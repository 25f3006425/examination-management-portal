{% extends "base.html" %}

{% block title %}Edit Course &middot; Admin Portal{% endblock %}

{% block content %}
<div class="container my-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm" style="border-top: 4px solid var(--gold);">
                <div class="card-header card-header-maroon d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-pencil-square me-2 text-gold"></i>Edit Course Information</span>
                    <span class="badge bg-gold text-dark">Course #{{ course.id }}</span>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Course Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ course.name }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Course Description</label>
                            <textarea name="description" class="form-control" rows="4">{{ course.description or "" }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('courses') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i>Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
