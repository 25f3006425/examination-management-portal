<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &middot; Examination Management Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --maroon: #8B2E24;
            --maroon-dark: #6E2219;
            --gold: #D4A017;
            --gold-light: #FEF8E7;
            --bg-light: #F3F4F6;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 10px 30px rgba(139, 46, 36, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
            color: #FFFFFF;
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
            border-bottom: 3.5px solid var(--gold);
            position: relative;
        }

        .auth-header .crest-icon {
            font-size: 2.4rem;
            color: var(--gold);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
            display: inline-block;
            margin-bottom: 0.35rem;
        }

        .auth-header h1 {
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 700;
            font-size: 1.45rem;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .auth-header .auth-sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.82);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        .auth-body {
            padding: 2rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: #F9FAFB;
            border-color: #D1D5DB;
            color: #6B7280;
        }

        .form-control {
            border-color: #D1D5DB;
            padding: 0.62rem 0.85rem;
            font-size: 0.94rem;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: var(--maroon) !important;
            box-shadow: 0 0 0 0.25rem rgba(139, 46, 36, 0.16) !important;
        }

        .btn-auth {
            background-color: var(--maroon) !important;
            border-color: var(--maroon) !important;
            color: #FFFFFF !important;
            font-weight: 600;
            font-size: 0.96rem;
            padding: 0.7rem;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(139, 46, 36, 0.22);
            transition: all 0.2s ease;
        }

        .btn-auth:hover {
            background-color: var(--maroon-dark) !important;
            border-color: var(--maroon-dark) !important;
            box-shadow: 0 6px 14px rgba(110, 34, 25, 0.32);
            transform: translateY(-1px);
        }

        .auth-footer {
            background-color: #F9FAFB;
            border-top: 1px solid #E5E7EB;
            padding: 1.15rem 1.5rem;
            text-align: center;
            font-size: 0.86rem;
        }

        .auth-footer a {
            color: var(--maroon);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert-info {
            background-color: var(--gold-light);
            border-color: #F0C45B;
            color: #7A5700;
            border-radius: 6px;
            font-size: 0.88rem;
        }
    </style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="bi bi-mortarboard-fill crest-icon"></i>
            <h1>Exam Portal</h1>
            <div class="auth-sub">Secure University Access</div>
        </div>

        <div class="auth-body">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-info py-2 px-3 mb-3 d-flex align-items-center">
                    <i class="bi bi-info-circle-fill me-2 text-warning"></i>
                    <div>{{ message }}</div>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label">University Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="name@university.edu" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-auth w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Portal
                </button>
            </form>
        </div>

        <div class="auth-footer text-muted">
            <div class="mb-1">
                New Student? <a href="{{ url_for('register') }}">Create student account</a>
            </div>
            <div>
                Faculty Examiner? <a href="{{ url_for('examiner_register') }}">Examiner registration</a>
            </div>
        </div>
    </div>

    <div class="text-center mt-3 small text-muted">
        &copy; 2026 Examination Management Portal
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
