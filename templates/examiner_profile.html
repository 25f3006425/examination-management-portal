{% extends "base.html" %}

{% block title %}Faculty Profile &middot; Exam Portal{% endblock %}

{% block content %}
<div class="container my-3">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm" style="border-top: 4px solid var(--maroon);">
                <div class="card-header card-header-maroon d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-person-badge-fill me-2 text-gold"></i>Faculty Examiner Profile</span>
                    <span class="badge bg-gold text-dark">Institutional Credentials</span>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Full Name &amp; Title <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ examiner.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Institutional Email</label>
                            <input type="email" class="form-control bg-light" value="{{ examiner.email }}" readonly>
                            <div class="form-text small">Email cannot be changed directly for faculty credential verification.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Highest Academic Qualification</label>
                            <input type="text" name="qualification" class="form-control" placeholder="e.g. Ph.D. in Computer Science" value="{{ profile.qualification or '' }}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Field of Specialization</label>
                            <input type="text" name="specialization" class="form-control" placeholder="e.g. Distributed Systems &amp; Web Architectures" value="{{ profile.specialization or '' }}">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('examiner_dashboard') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i>Update Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
