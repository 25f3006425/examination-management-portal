{% extends "base.html" %}

{% block title %}Add New Course – Admin Portal{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2"></i>Create New Course</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Course Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Modern Application Development I" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Course Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Overview of the curriculum, objectives, and prerequisites..."></textarea>
                        </div>

                        <!-- Optional Initial Study Resource -->
                        <div class="border rounded p-3 bg-light mb-4">
                            <h6 class="fw-bold text-primary mb-2">
                                <i class="bi bi-folder2-open me-1"></i>Initial Study Resource (Optional)
                            </h6>
                            <p class="small text-muted mb-3">You can attach an initial resource link now, or add more later via <strong>Manage Resources</strong>.</p>
                            
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Resource Title</label>
                                    <input type="text" name="resource_title" class="form-control form-control-sm" placeholder="e.g. Course Syllabus & Notes">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Resource URL</label>
                                    <input type="url" name="resource_url" class="form-control form-control-sm" placeholder="https://...">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('courses') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-check-lg me-1"></i> Create Course
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
