{% extends "base.html" %}

{% block title %}Add Rubric Criterion &middot; {{ examination.name }}{% endblock %}

{% block content %}
<div class="container my-3">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm" style="border-top: 4px solid var(--maroon);">
                <div class="card-header card-header-maroon d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-plus-circle me-2 text-gold"></i>New Evaluation Criterion</span>
                    <span class="badge bg-gold text-dark">{{ examination.name }}</span>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Criterion Title / Description <span class="text-danger">*</span></label>
                            <input type="text" name="criterion" class="form-control" placeholder="e.g. Code Architecture &amp; Database Design" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Maximum Allocated Marks <span class="text-danger">*</span></label>
                            <input type="number" name="marks" class="form-control" min="1" placeholder="e.g. 25" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('manage_rubrics', examination_id=examination.id) }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i>Add Criterion
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
