{% extends "base.html" %}

{% block title %}Edit Slot &middot; Faculty Portal{% endblock %}

{% block content %}
<div class="container my-3">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm" style="border-top: 4px solid var(--gold);">
                <div class="card-header card-header-maroon d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-pencil-square me-2 text-gold"></i>Edit Examination Slot</span>
                    <span class="badge bg-gold text-dark">Slot #{{ slot.id }}</span>
                </div>
                <div class="card-body p-4 bg-white">
                    <div class="p-3 rounded mb-4" style="background-color: var(--maroon-subtle); border-left: 4px solid var(--maroon);">
                        <span class="text-muted small d-block">Target Examination:</span>
                        <strong class="text-maroon fs-6">{{ slot.examination.name }}</strong>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Scheduled Date <span class="text-danger">*</span></label>
                            <input type="date" name="date" class="form-control" value="{{ slot.date }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Scheduled Time Window <span class="text-danger">*</span></label>
                            <input type="time" name="time" class="form-control" value="{{ slot.time }}" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('examiner_slots') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i>Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
