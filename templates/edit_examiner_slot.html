{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Examination Slot</h2>

    <p>
        <strong>Examination:</strong>
        {{ slot.examination.name }}
    </p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Date</label>

            <input type="date"
                   name="date"
                   class="form-control"
                   value="{{ slot.date }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Time</label>

            <input type="time"
                   name="time"
                   class="form-control"
                   value="{{ slot.time }}"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('examiner_slots') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
