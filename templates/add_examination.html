<!DOCTYPE html>
<html>
<head>
    <title>Add Examination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Add New Examination</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-warning">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% if courses %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Examination Name</label>

            <input type="text"
                   name="name"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Course</label>

            <select name="course_id" class="form-select" required>

                <option value="">Choose a course</option>

                {% for course in courses %}
                <option value="{{ course.id }}">
                    {{ course.name }}
                </option>
                {% endfor %}

            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Add Examination
        </button>

        <a href="{{ url_for('examinations') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

    {% else %}

        <p>No courses are available. Please add a course first.</p>

        <a href="{{ url_for('add_course') }}"
           class="btn btn-primary">
            Add Course
        </a>

    {% endif %}

</div>

</body>
</html>
