<!DOCTYPE html>
<html>
<head>
    <title>Edit Rubric</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Edit Evaluation Criterion</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-warning">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Criterion Name</label>

            <input type="text"
                   name="criterion"
                   class="form-control"
                   value="{{ rubric.criterion }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Marks</label>

            <input type="number"
                   name="marks"
                   class="form-control"
                   value="{{ rubric.marks }}"
                   min="1"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('manage_rubrics',
                            examination_id=rubric.examination_id) }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
