{% extends "base.html" %}

{% block title %}Edit Examination &middot; Admin Portal{% endblock %}

{% block content %}
<div class="container my-3">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm" style="border-top: 4px solid var(--gold);">
                <div class="card-header card-header-maroon d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-pencil-square me-2 text-gold"></i>Edit Examination Details</span>
                    <span class="badge bg-gold text-dark">Exam #{{ examination.id }}</span>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Examination Title <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ examination.name }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Associated Course <span class="text-danger">*</span></label>
                            <select name="course_id" class="form-select" required>
                                {% for course in courses %}
                                <option value="{{ course.id }}" {% if course.id == examination.course_id %}selected{% endif %}>
                                    {{ course.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('examinations') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i>Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
