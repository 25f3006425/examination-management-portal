<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>My Profile</h2>

    <a href="/student_dashboard" class="btn btn-secondary mb-3">
        Back to Dashboard
    </a>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-info">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <div class="card shadow">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Name</label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ student.name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ student.email }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>

                    <input type="text"
                           class="form-control"
                           value="{{ student.role }}"
                           readonly>
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Profile
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
